<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Düzen: üstte firma şeridi + modül sekmeleri; altında tek sütun iş alanı, özet sayfasında 2 sütun (ödemeler | banka+personel). */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F8FAFB;
  --ink:#13212C; --ink-2:#4E5F6C; --ink-3:#86949F;
  --rule:#CBD5DD; --rule-soft:#E3E9EE;
  --accent:#0C6B5C; --accent-soft:#DDEFEA;
  --red:#B42318; --red-soft:#FBE4E1;
  --amber:#9A6200; --amber-soft:#FBEED3;
  --yel:#7A6A00; --yel-soft:#FBF6D6;
  --ok:#2F7A46; --ok-soft:#E1F1E6;
  --shadow:0 1px 2px rgba(19,33,44,.06),0 10px 24px -18px rgba(19,33,44,.35);
  --f-disp:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171D; --surface:#162129; --surface-2:#1B2831;
  --ink:#E4EBF0; --ink-2:#A2B2BE; --ink-3:#6F808C;
  --rule:#2E3E4A; --rule-soft:#22313B;
  --accent:#4FC2A9; --accent-soft:#16332D;
  --red:#F2856F; --red-soft:#3A1D19;
  --amber:#E9B04F; --amber-soft:#33270F;
  --yel:#D9C95A; --yel-soft:#2E2B12;
  --ok:#6CC58A; --ok-soft:#16301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -18px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171D; --surface:#162129; --surface-2:#1B2831;
  --ink:#E4EBF0; --ink-2:#A2B2BE; --ink-3:#6F808C;
  --rule:#2E3E4A; --rule-soft:#22313B;
  --accent:#4FC2A9; --accent-soft:#16332D;
  --red:#F2856F; --red-soft:#3A1D19;
  --amber:#E9B04F; --amber-soft:#33270F;
  --yel:#D9C95A; --yel-soft:#2E2B12;
  --ok:#6CC58A; --ok-soft:#16301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -18px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:.005em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* üst şerit */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mono{width:38px;height:38px;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--surface);
  font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.04em;border-radius:4px}
.brand h1{font-size:19px;line-height:1.1;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.brand p{margin:0;font-size:12px;color:var(--ink-3)}
.mods{display:flex;gap:6px;flex-wrap:wrap}
.mod{font-family:var(--f-disp);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
  padding:7px 12px;border-radius:4px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);text-decoration:none}
.mod.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mod:hover:not(.on){border-color:var(--ink-3);color:var(--ink)}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--ok)} .dot.yerel{background:var(--amber)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-top:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px 10px;border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:14.5px;
  border-bottom:3px solid transparent;text-decoration:none;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .rozet{display:inline-block;min-width:19px;padding:0 5px;margin-left:5px;border-radius:10px;background:var(--red);color:#fff;
  font-size:11.5px;font-weight:700;line-height:19px;text-align:center}

main .wrap{padding-block:18px 60px}
.bas{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bas h2{font-size:26px;font-weight:700;line-height:1.1}
.bas .alt{color:var(--ink-3);font-size:13.5px;width:100%;margin-top:-6px}
.bas .sag{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--rule);background:var(--surface);border-radius:5px;padding:8px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn.pri{color:#06201B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06201B}}
.btn.kc{padding:4px 9px;font-size:12.5px}
.btn.ode{border-color:var(--ok);color:var(--ok)}
.btn.ode:hover{background:var(--ok-soft)}
.btn.tehlike{border-color:var(--red);color:var(--red)}
.btn.tehlike:hover{background:var(--red-soft)}
.lnk{border:0;background:transparent;color:var(--accent);padding:2px 4px;font-weight:600;font-size:13px}
.lnk:hover{text-decoration:underline}

/* KPI şeridi */
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.kpi .c{padding:12px 16px 13px;border-right:1px solid var(--rule-soft);border-top:4px solid transparent;min-width:0}
.kpi .c:last-child{border-right:0}
.kpi .c.red{border-top-color:var(--red)} .kpi .c.amber{border-top-color:var(--amber)} .kpi .c.yel{border-top-color:var(--yel)} .kpi .c.n{border-top-color:var(--rule)}
.kpi .k{font-family:var(--f-disp);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--f-num);font-weight:600;font-size:22px;line-height:1.25;overflow-wrap:anywhere}
.kpi .c.red .v{color:var(--red)}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
@media (max-width:760px){.kpi{grid-template-columns:1fr 1fr}.kpi .c:nth-child(2){border-right:0}.kpi .c:nth-child(-n+2){border-bottom:1px solid var(--rule-soft)}}

.izgara{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.izgara{grid-template-columns:1fr}}
.izgara>div{min-width:0}
@media (max-width:560px){.kpi .v{font-size:18px}.hc{grid-template-columns:84px minmax(0,1fr) 96px;font-size:12.5px}table.t{font-size:13.5px}table.t td,table.t th{padding:7px 7px}}
.kutu{background:var(--surface);border:1px solid var(--rule-soft);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;margin-bottom:18px}
.kutu>.hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
.kutu>.hd h3{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kutu>.hd .say{color:var(--ink-3);font-size:13px}
.kutu>.hd .sag{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kutu>.bd{padding:12px 14px}
.bos{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.5}
.bos b{color:var(--ink-2)}
.bos .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* tablolar */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-family:var(--f-disp);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface-2)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
table.t td.tl{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-weight:500}
table.t td.d{white-space:nowrap;font-variant-numeric:tabular-nums}
table.t td.act{white-space:nowrap;text-align:right}
table.t tr.gec td:first-child{box-shadow:inset 4px 0 0 var(--red)}
table.t tr.acil td:first-child{box-shadow:inset 4px 0 0 var(--amber)}
table.t tr.hafta td:first-child{box-shadow:inset 4px 0 0 var(--yel)}
table.t tr.kapali td{color:var(--ink-3)}
table.t tr.top td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--rule)}
table.t tr.grp td{font-weight:700;background:var(--surface-2);font-family:var(--f-disp);letter-spacing:.04em;text-transform:uppercase;font-size:13.5px}
table.t td.ic{padding-left:22px;color:var(--ink-2)}
.ad{font-weight:600}
.ac{display:block;font-size:12.5px;color:var(--ink-3)}
.bos-h{color:var(--ink-3)}

/* durum hapları */
.hap{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap;
  background:var(--rule-soft);color:var(--ink-2)}
.hap.red{background:var(--red-soft);color:var(--red)}
.hap.amber{background:var(--amber-soft);color:var(--amber)}
.hap.yel{background:var(--yel-soft);color:var(--yel)}
.hap.ok{background:var(--ok-soft);color:var(--ok)}
.hap.acc{background:var(--accent-soft);color:var(--accent)}
.etk{display:inline-block;font-family:var(--f-disp);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:1px 7px;border:1px solid var(--rule);border-radius:3px;color:var(--ink-2);white-space:nowrap}
.tah{font-size:11.5px;color:var(--amber);font-weight:600}

/* filtre */
.filtre{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cip{border:1px solid var(--rule);background:var(--surface);border-radius:16px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.cip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ara{flex:1;min-width:180px;max-width:320px;border:1px solid var(--rule);background:var(--surface);border-radius:5px;padding:7px 11px}

/* banka kartları */
.bk{padding:12px 14px;border-bottom:1px solid var(--rule-soft);display:grid;gap:4px}
.bk:last-child{border-bottom:0}
.bk .ust{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bk .ust b{font-family:var(--f-disp);font-size:16px;letter-spacing:.03em}
.bk .ust .hap{margin-left:auto}
.bk .sat{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-2)}
.bk .sat span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.cubuk{height:6px;background:var(--rule-soft);border-radius:3px;overflow:hidden;margin-top:4px}
.cubuk i{display:block;height:100%;background:var(--ok)}
.cubuk.red i{background:var(--red)} .cubuk.amber i{background:var(--amber)}

/* haftalık çek çubukları */
.hc{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.hc .bar{height:16px;background:var(--rule-soft);border-radius:3px;overflow:hidden;display:flex}
.hc .bar i{display:block;height:100%}
.hc .tl{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* modal */
.ort{position:fixed;inset:0;z-index:50;background:rgba(10,18,24,.5);display:grid;place-items:center;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.ort[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55);
  width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.modal .mh h3{font-size:18px;font-weight:700}
.modal .mh button{margin-left:auto;border:0;background:transparent;font-size:24px;line-height:1;color:var(--ink-3)}
.modal .mb{padding:14px 16px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.modal .mf{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--rule-soft);flex-wrap:wrap}
.modal .mf .sag{margin-left:auto;display:flex;gap:8px}
.alan{display:grid;gap:3px;min-width:0}
.alan.gen{grid-column:1/-1}
.alan label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.alan input,.alan select,.alan textarea{width:100%;border:1px solid var(--rule);background:var(--surface-2);border-radius:5px;padding:8px 10px;min-width:0}
.alan input:focus,.alan select:focus,.alan textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.alan .yd{font-size:12px;color:var(--ink-3)}
.alan.chk{display:flex;align-items:center;gap:8px;padding-top:18px}
.alan.chk input{width:auto}
.alan.chk label{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.hata{grid-column:1/-1;color:var(--red);font-size:13.5px;font-weight:600}
.onay{grid-column:1/-1;background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:5px;font-size:14px}
@media (max-width:560px){.modal .mb{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);
  padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.not{font-size:13px;color:var(--ink-3);margin:6px 0 0}
.uyari{background:var(--amber-soft);color:var(--amber);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:14px}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.ikili{grid-template-columns:1fr}}
.sec{border:1px solid var(--rule);background:var(--surface);border-radius:5px;padding:6px 9px}
</style>

const PERIYOT={"AYLIK":1,"2 AYLIK":2,"3 AYLIK":3,"6 AYLIK":6,"YILLIK":12};
const IZIN_TUR=["YILLIK","MAZERET","RAPOR","ÜCRETSİZ","DOĞUM","EVLİLİK","ÖLÜM","BABALIK","DİĞER"];

/* Odabaşlar bilançosundaki gider yapısı */
const GIDER=[
 ["SATIŞLARIN MALİYETİ",["Brüt mal alımı (ürün ödemeleri)"]],
 ["PERSONEL GİDERLERİ",["Personel Maaşları","Personel İcra Kesintisi Ödemeleri","Personel Yemek (Setcart)","Personel Tazminat / İzin Ödemeleri","SGK Primi","Bağkur – Gökyıl Odabaş"]],
 ["VERGİ VE HARÇLAR",["Vergi Ödemeleri"]],
 ["KİRA VE İŞLETME GİDERLERİ",["Depo Kirası / Giderleri","Otopark","Mağaza Elektrik","Depo Elektrik","Muhasebe Telefon Hattı","Online Telefon Hattı","İnternet – Mağaza ve Depo","Sigorta","Bakım / Onarım","Temizlik","Market / Mutfak"]],

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const tarih=s=>{if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const bugunD=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const gunEkle=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const ayGun=(y,m)=>new Date(y,m+1,0).getDate();
const ayEkle=(d,n)=>{const t=new Date(d.getFullYear(),d.getMonth()+n,1);return new Date(t.getFullYear(),t.getMonth(),Math.min(d.getDate(),ayGun(t.getFullYear(),t.getMonth())));};
const gunAy=(y,m,g)=>new Date(y,m,Math.max(1,Math.min(g,ayGun(y,m))));
const fark=(a,b)=>Math.round((a-b)/864e5);
const trT=d=>{d=typeof d==="string"?tarih(d):d;return d?pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear():"";};
const trK=d=>{d=typeof d==="string"?tarih(d):d;return d?pad(d.getDate())+"."+pad(d.getMonth()+1):"";};
const ayAd=(y,m)=>AYLAR[m]+" "+y;
const ymKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const yilEkle=(d,n)=>{const t=new Date(d.getFullYear()+n,d.getMonth(),d.getDate());return t.getMonth()!==d.getMonth()?new Date(d.getFullYear()+n,d.getMonth(),28):t;};
const TL=new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const tl=n=>n==null||n===""?"—":TL.format(n)+" ₺";
const tlK=n=>n==null?"—":(Math.abs(n)>=1e6?TL.format(n/1e6).replace(/,00$/,"")+" mn ₺":TL.format(n)+" ₺");
function sayi(v){
  if(v==null||v==="")return null;
  if(typeof v==="number")return isFinite(v)?v:null;
  let t=String(v).replace(/[^\d.,-]/g,"");if(!t)return null;
  const c=t.lastIndexOf(","),p=t.lastIndexOf(".");
  if(c>=0&&p>=0)t=c>p?t.replace(/\./g,"").replace(",","."):t.replace(/,/g,"");
  else if(c>=0)t=t.replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,"");
  const n=parseFloat(t);return isFinite(n)?n:null;
}

let HT=new Set([0]);
const bankaGunu=d=>{const w=d.getDay();const t=TATILM.get(iso(d));return w!==0&&w!==6&&!(t===false);};
const sonrakiBankaGunu=d=>{while(!bankaGunu(d))d=gunEkle(d,1);return d;};
const isGunuDeg=d=>{if(HT.has(d.getDay()))return 0;const t=TATILM.get(iso(d));if(t===undefined)return 1;return t?0.5:0;};
const isGunuSay=(a,b)=>{let n=0;for(let d=a;d<=b;d=gunEkle(d,1))n+=isGunuDeg(d);return n;};
const sonrakiIsGunu=d=>{d=gunEkle(d,1);while(isGunuDeg(d)===0)d=gunEkle(d,1);return d;};

/* ═══════════ HESAP: KALEMLER ═══════════ */
function ayar(){
  const a=S.ayar;const n=(v,d)=>{const x=sayi(v);return x==null?d:x;};
  const gmap={"PAZAR":0,"PAZARTESİ":1,"SALI":2,"ÇARŞAMBA":3,"PERŞEMBE":4,"CUMA":5,"CUMARTESİ":6};
  const ht=new Set(String(a.haftaTatili||"PAZAR").split(",").map(up).filter(x=>x in gmap).map(x=>gmap[x]));
  HT=ht.size?ht:new Set([0]);
  return {firma:a.firma||"",ufuk:n(a.ufuk,30),acil:n(a.acil,3),cekAy:n(a.cekAy,6),gecmisAy:n(a.gecmisAy,6),dogumGunu:n(a.dogumGunu,7)};
}
function durumCoz(v,ot){const d=up(v);if(d.startsWith("ÖDEN")||d.startsWith("ODEN"))return"ÖDENDİ";if(d.startsWith("İPTAL")||d.startsWith("IPTAL"))return"İPTAL";if(!d&&ot)return"ÖDENDİ";return"BEKLİYOR";}
function varsGider(kat,tur,metin){
  const m=up(metin);
  if(kat==="ÇEK"||kat==="DBS")return"Brüt mal alımı (ürün ödemeleri)";
  if(kat==="KREDİ KARTI")return"Kredi Kartı Ödemesi (dağıtılmamış)";
  if(tur==="ELEKTRİK")return m.includes("DEPO")?"Depo Elektrik":/(^|\s)EV(\s|$)/.test(m)?"Ev Elektrik Gideri":"Mağaza Elektrik";
  if(tur==="İNTERNET")return /(^|\s)EV(\s|$)/.test(m)?"Ev İnterneti (Yakanet)":"İnternet – Mağaza ve Depo";
  if(tur==="TELEFON")return m.includes("ONL")?"Online Telefon Hattı":"Muhasebe Telefon Hattı";
  const h={"SGK":"SGK Primi","MAAŞ":"Personel Maaşları","KDV":"Vergi Ödemeleri","MUHTASAR":"Vergi Ödemeleri","GEÇİCİ VERGİ":"Vergi Ödemeleri","VERGİ":"Vergi Ödemeleri",
    "SİGORTA":"Sigorta","KİRA":"Depo Kirası / Giderleri","MUHASEBE":"Muhasebe Gideri","KREDİ TAKSİTİ":"Kredi Taksiti / Faiz","KARGO":"Kargo","TERZİ":"Terzi","OTOPARK":"Otopark","TEMİZLİK":"Temizlik"};
  return h[tur]||"Diğer";
}
function giderAta(k,d){
  const metin=[k.aciklama,k.kime,k.not,k.tur].join(" ");
  k.gider=(d&&d.gider)||varsGider(k.kat,k.tur,metin);
  const y=up(d&&d.yer);
  k.yer=y?(y.startsWith("ONL")?"ONLİNE":y):(up(metin).includes("ONL")?"ONLİNE":ORTAK_K.has(up(k.gider))?"ORTAK":"MAĞAZA");
  return k;
}
const kartBul=d=>S.kart.find(k=>k.id===d.kartId)||S.kart.find(k=>up(k.ad)===up(d.kartAd))||null;

function kalemler(){
  const A=ayar(),bugun=bugunD();
  const out=[],bastir=new Set();
  for(const d of S.odeme){
    const vade=tarih(d.vade);if(!vade)continue;
    const ot=d.odemeTarihi||"";
    const k={id:d.id,doc:d,kat:d.kat||"DİĞER",tur:up(d.tur)||"",vade,kime:d.kime||"",tutar:sayi(d.tutar),durum:durumCoz(d.durum,ot),
      banka:up(d.banka),hesap:up(d.hesap),odemeTarihi:tarih(ot),tahmini:false,otomatik:!!d.otomatik,not:d.not||"",ornek:!!d.ornek};
    if(k.kat==="ÇEK"){k.aciklama="Çek "+(d.no||"");}
    else if(k.kat==="DBS"){k.aciklama="DBS "+(d.no||"");}
    else if(k.kat==="FATURA"){k.aciklama=[k.tur,d.yerAdi,d.no].filter(Boolean).join(" · ");bastir.add("F:"+k.tur+"|"+up(d.no)+"@"+ymKey(vade));}
    else if(k.kat==="KREDİ KARTI"){
      const kt=kartBul(d);k.aciklama=((kt&&kt.ad)||d.kartAd||"Kart")+" ekstresi";k.kime=kt?up(kt.banka):"";
      k.banka=kt?up(kt.odemeBanka||kt.banka):k.banka;k.hesap=kt?up(kt.odemeHesap):k.hesap;k.otomatik=!!(kt&&kt.otomatik);
      const ek=sayi(d.tutar),od=sayi(d.odenen)||0;
      if(ek!=null&&ek-od<=0.005){k.durum="ÖDENDİ";k.tutar=ek;}
      else if(od>0){k.durum="KISMİ";k.tutar=ek!=null?ek-od:null;k.not=[k.not,"Ödenen: "+tl(od)].filter(Boolean).join(" · ");}
      else if(up(d.durum)!=="İPTAL")k.durum="BEKLİYOR";
      if(sayi(d.asgari))k.not=[k.not,"Asgari: "+tl(sayi(d.asgari))].filter(Boolean).join(" · ");
      if(kt)bastir.add("KART:"+kt.id+"@"+ymKey(vade));
    }else{k.aciklama=d.aciklama||k.tur||"Ödeme";}
    if(d.kaynak)bastir.add(d.kaynak+"@"+ymKey(vade));
    out.push(giderAta(k,d));
  }
  const son=gunEkle(bugun,Math.max(A.ufuk,31*A.cekAy));
  const aylar=(anchor,p)=>{const r=[];let d=new Date(bugun.getFullYear(),bugun.getMonth(),1);while(d<=son){const f=(d.getFullYear()-anchor.getFullYear())*12+d.getMonth()-anchor.getMonth();if(f>=0&&f%p===0)r.push([d.getFullYear(),d.getMonth()]);d=new Date(d.getFullYear(),d.getMonth()+1,1);}return r;};
  for(const kt of S.kart){
    if(kt.aktif===false)continue;const g=sayi(kt.sonOdemeGunu);if(!g)continue;
    for(const [y,m] of aylar(new Date(2000,0,1),1)){
      const v=gunAy(y,m,g);const key="KART:"+kt.id;
      if(v<bugun||bastir.has(key+"@"+ymKey(v)))continue;
      out.push(giderAta({id:"t:"+key+"@"+ymKey(v),kat:"KREDİ KARTI",tur:"",aciklama:(kt.ad||"Kart")+" ekstresi",kime:up(kt.banka),vade:v,tutar:null,durum:"BEKLİYOR",
        banka:up(kt.odemeBanka||kt.banka),hesap:up(kt.odemeHesap),tahmini:true,otomatik:!!kt.otomatik,not:"Ekstre tutarı girilmedi",kaynak:key,kart:kt,ornek:!!kt.ornek},null));
    }
  }
  for(const dz of S.duzenli){
    if(dz.aktif===false)continue;const g=sayi(dz.gun);if(!g)continue;
    const tur=up(dz.tur)||"DİĞER",p=PERIYOT[up(dz.periyot)]||1,bas=tarih(dz.baslangic),bit=tarih(dz.bitis);
    const key="DUZ:"+dz.id,alt=dz.ref?"F:"+tur+"|"+up(dz.ref):null;
    const kat=FATURA_TUR.includes(tur)&&tur!=="DİĞER"&&tur!=="AİDAT"?"FATURA":"DÜZENLİ";
    for(const [y,m] of aylar(bas||new Date(bugun.getFullYear(),0,1),p)){
      const v=gunAy(y,m,g),ym=ymKey(v);
      if(v<bugun||(bas&&v<bas)||(bit&&v>bit)||bastir.has(key+"@"+ym)||(alt&&bastir.has(alt+"@"+ym)))continue;
      out.push(giderAta({id:"t:"+key+"@"+ym,kat,tur,aciklama:dz.aciklama||tur,kime:dz.ref||"",vade:v,tutar:sayi(dz.tutar),durum:"BEKLİYOR",
        banka:up(dz.banka),hesap:up(dz.hesap),tahmini:true,otomatik:false,not:"Düzenli ödeme",kaynak:key,duz:dz,ornek:!!dz.ornek},dz));
    }
  }
  out.sort((a,b)=>a.vade-b.vade||KATS.indexOf(a.kat)-KATS.indexOf(b.kat));
  return out;
}
const bekliyor=k=>k.durum==="BEKLİYOR"||k.durum==="KISMİ";
const katEt=k=>k.tur&&k.tur!==k.kat&&k.kat!=="ÇEK"&&k.kat!=="DBS"?k.kat+" · "+k.tur:k.kat;
function kalanHap(k,A,bugun){
  if(!bekliyor(k))return k.durum==="ÖDENDİ"?'<span class="hap ok">ÖDENDİ</span>':'<span class="hap">'+esc(k.durum)+'</span>';
  const n=fark(k.vade,bugun);
  if(n<0)return'<span class="hap red">GECİKTİ '+(-n)+' gün</span>';
  if(n===0)return'<span class="hap amber">BUGÜN</span>';
  if(n===1)return'<span class="hap amber">YARIN</span>';
  if(n<=A.acil)return'<span class="hap amber">'+n+' gün</span>';
  if(n<=7)return'<span class="hap yel">'+n+' gün</span>';
  return'<span class="hap">'+n+' gün</span>';
}
function satirSinif(k,A,bugun){if(!bekliyor(k))return"kapali";const n=fark(k.vade,bugun);return n<0?"gec":n<=A.acil?"acil":n<=7?"hafta":"";}

/* banka */
function hesapBul(banka,hesap){if(!banka)return null;const ad=S.banka.filter(h=>up(h.banka)===banka);if(hesap){const h=ad.find(x=>up(x.hesap)===hesap);if(h)return h;}return ad[0]||null;}
const hesapEt=h=>up(h.banka)+(h.hesap?" / "+up(h.hesap):"");
function projeksiyon(K,A,bugun){
  const son=gunEkle(bugun,A.ufuk);
  return S.banka.map(h=>{
    let bakiye=sayi(h.bakiye)||0;const bt=tarih(h.bakiyeTarihi);
    const ileri=[];
    for(const x of S.hareket){
      const d=tarih(x.tarih),t=sayi(x.tutar);if(!d||t==null)continue;if(hesapBul(up(x.banka),up(x.hesap))!==h)continue;
      if(bt&&d<=bt)continue;const isr=up(x.tur).startsWith("Ç")||t<0?-1:1;
      if(d<=bugun)bakiye+=isr*Math.abs(t);else if(d<=son)ileri.push({vade:d,tur:isr>0?"GİRİŞ":"ÇIKIŞ",aciklama:x.aciklama||"Beklenen hareket",kime:"",t:isr*Math.abs(t)});
    }
    const hr=K.filter(k=>bekliyor(k)&&k.vade<=son&&hesapBul(k.banka,k.hesap)===h)
      .map(k=>({vade:k.vade,tur:katEt(k),aciklama:k.aciklama+(k.tahmini?" (tahmini)":""),kime:k.kime,t:-(k.tutar||0),bilinmez:k.tutar==null}));
    const hepsi=hr.concat(ileri).map(x=>({...x,islem:sonrakiBankaGunu(x.vade<bugun?bugun:x.vade)}));
    hepsi.sort((a,b)=>a.islem-b.islem||b.t-a.t);
    let b=bakiye,min=bakiye,minT=null,c7=0,cu=0;
    hepsi.forEach(x=>{b+=x.t;x.bakiye=b;if(b<min){min=b;minT=x.islem;}if(x.t<0){cu-=x.t;if(x.islem<=gunEkle(bugun,7))c7-=x.t;}});
    const kmh=sayi(h.kmh)||0;
    const dur=min< -kmh?{s:"red",m:"YETERSİZ · "+tl(-kmh-min)+" eksik"}:min<0?{s:"amber",m:"KMH kullanılacak"}:{s:"ok",m:"Yeterli"};
    const eski=bt&&fark(bugun,bt)>7;
    return {h,et:hesapEt(h),bakiye,kmh,min,minT,c7,cu,dur,hepsi,eski,bt};
  });
}

/* personel */
function yillikHak(kidem,yas){let h=kidem<=5?14:kidem<15?20:26;if(yas!=null&&(yas<=18||yas>=50))h=Math.max(h,20);return h;}
function yas(dg,g){if(!dg)return null;return g.getFullYear()-dg.getFullYear()-((g.getMonth()<dg.getMonth()||(g.getMonth()===dg.getMonth()&&g.getDate()<dg.getDate()))?1:0);}
function izinler(){
  return S.izin.map(z=>{
    const bas=tarih(z.bas);if(!bas)return null;let bit=tarih(z.bit)||bas;if(bit<bas)bit=bas;
    const tur=up(z.tur)||"YILLIK";let gun=sayi(z.gun);
    if(gun==null)gun=tur==="YILLIK"||tur==="MAZERET"?isGunuSay(bas,bit):fark(bit,bas)+1;
    const p=S.personel.find(x=>x.id===z.personelId);
    return {id:z.id,doc:z,p,ad:p?p.ad:(z.personelAd||"?"),tur,bas,bit,gun,onay:up(z.onay)||"ONAYLANDI",aciklama:z.aciklama||"",donus:sonrakiIsGunu(bit)};
  }).filter(Boolean).sort((a,b)=>a.bas-b.bas);
}
function izinDurum(p,Z,bugun){
  const r={kidem:null,hak:null,hakEdilen:0,kullanilan:0,planlanan:0,kalan:null,sonraki:null,sonrakiGun:null};
  const giris=tarih(p.giris);if(!giris)return r;
  const cikis=tarih(p.cikis),ref=cikis&&cikis<bugun?cikis:bugun,dg=tarih(p.dogum),devir=tarih(p.devirTarihi);
  const kd=Math.max(0,yas(giris,ref));r.kidem=kd;
  const basl=devir||giris;
  for(let k=1;k<=kd;k++){const d=yilEkle(giris,k);if(d>basl||(!devir&&d>=basl))r.hakEdilen+=yillikHak(k,yas(dg,d));}
  r.sonraki=yilEkle(giris,kd+1);r.sonrakiGun=yillikHak(kd+1,yas(dg,r.sonraki));r.hak=yillikHak(Math.max(kd,1),yas(dg,ref));
  Z.filter(z=>z.p===p&&z.tur==="YILLIK"&&z.onay!=="RED"&&!(devir&&z.bas<=devir)).forEach(z=>{if(z.bas<=bugun)r.kullanilan+=z.gun;else r.planlanan+=z.gun;});
  r.kalan=(sayi(p.devreden)||0)+r.hakEdilen-r.kullanilan-r.planlanan;
  return r;
}
const aktifP=(p,b)=>{const c=tarih(p.cikis);return !c||c>=b;};
function personelHat(Z,A,bugun){
  const son=gunEkle(bugun,A.ufuk),h=[];
  Z.forEach(z=>{
    if(z.onay==="RED")return;
    if(z.bas<=bugun&&bugun<=z.bit)h.push({t:bugun,ad:z.ad,k:"İZİNDE",d:z.tur+" · "+trK(z.bas)+"–"+trK(z.bit)+" · dönüş "+trT(z.donus),c:"acc"});
    else if(z.bas>bugun&&z.bas<=son)h.push({t:z.bas,ad:z.ad,k:"İZİN BAŞLIYOR",d:z.tur+" · "+z.gun+" gün"+(z.onay==="BEKLİYOR"?" · onay bekliyor":""),c:z.onay==="BEKLİYOR"?"yel":""});
    if(z.bas<=bugun&&z.donus>=bugun&&z.donus<=son)h.push({t:z.donus,ad:z.ad,k:"İŞE DÖNÜŞ",d:z.tur+" izni bitiyor",c:""});
  });
  S.personel.filter(p=>aktifP(p,bugun)).forEach(p=>{
    const d=izinDurum(p,Z,bugun);
    if(d.sonraki&&d.sonraki<=son)h.push({t:d.sonraki,ad:p.ad,k:"İZİN HAK EDİŞ",d:(d.kidem+1)+". yıl · +"+d.sonrakiGun+" gün",c:"ok"});
    const dg=tarih(p.dogum);
    if(A.dogumGunu&&dg){let x=new Date(bugun.getFullYear(),dg.getMonth(),dg.getDate());if(x<bugun)x=new Date(bugun.getFullYear()+1,dg.getMonth(),dg.getDate());
      if(fark(x,bugun)<=A.dogumGunu)h.push({t:x,ad:p.ad,k:"DOĞUM GÜNÜ",d:(x.getFullYear()-dg.getFullYear())+" yaş",c:""});}
    const g=tarih(p.giris);if(g){const ds=ayEkle(g,2);if(ds>=bugun&&ds<=son)h.push({t:ds,ad:p.ad,k:"DENEME SÜRESİ BİTİYOR",d:"İşe giriş "+trT(g),c:"yel"});}
    const c=tarih(p.cikis);if(c&&c>=bugun&&c<=son)h.push({t:c,ad:p.ad,k:"İŞTEN ÇIKIŞ",d:"",c:"red"});
  });
  return h.sort((a,b)=>a.t-b.t);
}

    if(bekliyor(k))top+=k.tutar||0;
    const islem=sonrakiBankaGunu(k.vade);const isn=bekliyor(k)&&iso(islem)!==iso(k.vade)?'<span class="ac">İşlem günü '+trK(islem)+'</span>':"";

      (k.not&&!opt.dar?'<span class="ac">'+esc(k.not)+'</span>':"")+'</td>'+
      '<td><span class="etk">'+esc(katEt(k))+'</span></td>'+(opt.dar?"":'<td>'+esc(k.banka||"—")+(k.hesap?'<span class="ac">'+esc(k.hesap)+'</span>':"")+'</td>')+
      '<td class="tl">'+(k.tutar==null?'<span class="bos-h">tutar yok</span>':tl(k.tutar))+'</td><td class="act">'+

  return t+'</tbody></table></div>';

    [(A.acil+1)+" – 7 gün",s(gunEkle(bugun,A.acil+1),gunEkle(bugun,7)),"yel"],["8 – "+A.ufuk+" gün",s(gunEkle(bugun,8),gunEkle(bugun,A.ufuk)),"n"]];
  let h=ornekSerit()+'<div class="bas"><h2>Bugün ne ödenecek?</h2><div class="sag"><button class="btn pri" data-act="yeniOdeme">+ Ödeme ekle</button></div></div>';

    return'<div class="c '+g[2]+'"><div class="k">'+g[0]+'</div><div class="v">'+tlK(t)+'</div><div class="s">'+g[1].length+' ödeme'+(bil?' · '+bil+' tutarsız':"")+'</div></div>';}).join("")+'</div>';
  const acil=B.filter(k=>k.vade<=gunEkle(bugun,7));

  // çek yükü 8 hafta
  const cekler=B.filter(k=>k.kat==="ÇEK");
  if(cekler.length){
    const pzt=gunEkle(bugun,-((bugun.getDay()+6)%7));const haftalar=[];
    for(let i=0;i<8;i++){const a=gunEkle(pzt,7*i),b=gunEkle(a,6);const L=cekler.filter(k=>(i===0?k.vade<=b:k.vade>=a&&k.vade<=b));haftalar.push([a,b,L]);}
    const bankalar=[...new Set(cekler.map(k=>k.banka||"—"))];const renk=bankaRenk(bankalar);
    const mx=Math.max(1,...haftalar.map(x=>x[2].reduce((a,k)=>a+(k.tutar||0),0)));
    h+='<section class="kutu"><div class="hd"><h3>Önümüzdeki 8 hafta çek yükü</h3><div class="sag"><a class="lnk" href="#cekler">Çek takvimi →</a></div></div><div class="bd">'+
      haftalar.map(([a,b,L])=>{const t=L.reduce((x,k)=>x+(k.tutar||0),0);
        return'<div class="hc"><span>'+trK(a)+' – '+trK(b)+'</span><span class="bar">'+bankalar.map(bn=>{const v=L.filter(k=>(k.banka||"—")===bn).reduce((x,k)=>x+(k.tutar||0),0);return v?'<i style="width:'+(v/mx*100).toFixed(1)+'%;background:'+renk[bn]+'" title="'+esc(bn)+': '+tl(v)+'"></i>':"";}).join("")+
        '</span><span class="tl">'+(t?tl(t):"—")+'</span></div>';}).join("")+
      '<div class="leg">'+bankalar.map(b=>'<span><i style="background:'+renk[b]+'"></i>'+esc(b)+'</span>').join("")+'<span>İlk haftaya gecikmiş çekler dahil</span></div></div></section>';
  }
  h+='</div><div>';
  h+='<section class="kutu"><div class="hd"><h3>Banka · '+A.ufuk+' gün</h3><div class="sag"><a class="lnk" href="#bankalar">Ayrıntı →</a></div></div>'+

const RENKLER=["#0C6B5C","#3E6FB0","#B5762A","#8A4FA3","#B0473E","#4C8C3B","#2D8A9A","#7A6A55"];
function bankaRenk(L){const r={};L.forEach((b,i)=>r[b]=RENKLER[i%RENKLER.length]);return r;}

function sOdemeler(K,A,bugun){
  let L=K;
  if(F.kat!=="HEPSİ")L=L.filter(k=>k.kat===F.kat);
  if(F.dur==="BEKLEYEN")L=L.filter(k=>bekliyor(k)&&k.vade<=gunEkle(bugun,Math.max(A.ufuk,60)));
  else if(F.dur==="ÖDENEN")L=L.filter(k=>k.durum==="ÖDENDİ").reverse();
  if(F.ara){const q=up(F.ara);L=L.filter(k=>up([k.aciklama,k.kime,k.banka,k.tur,k.not,k.gider].join(" ")).includes(q));}
  const say=c=>K.filter(k=>bekliyor(k)&&(c==="HEPSİ"||k.kat===c)).length;
  return ornekSerit()+'<div class="bas"><h2>Ödemeler</h2><div class="sag"><button class="btn pri" data-act="yeniOdeme">+ Ödeme ekle</button></div>'+
    '<div class="alt">Bekleyen: '+(F.dur==="BEKLEYEN"?Math.max(A.ufuk,60)+" gün içindekiler ve gecikmişler":"")+'. Kart ve düzenli ödemeler her dönem için tahmini olarak gelir; ekstre/fatura girildiğinde onun yerini alır.</div></div>'+
    '<div class="filtre">'+["HEPSİ",...KATS].map(c=>'<button class="cip" data-act="fKat" data-v="'+c+'" aria-pressed="'+(F.kat===c)+'">'+(c==="HEPSİ"?"Hepsi":c.charAt(0)+c.slice(1).toLocaleLowerCase("tr"))+' <span class="num">'+say(c)+'</span></button>').join("")+'</div>'+
    '<div class="filtre"><select class="sec" id="fDur" aria-label="Durum">'+["BEKLEYEN","ÖDENEN","TÜMÜ"].map(x=>'<option'+(F.dur===x?" selected":"")+'>'+x+'</option>').join("")+'</select>'+
    '<input class="ara" id="araK" placeholder="Ara: firma, çek no, banka…" value="'+esc(F.ara)+'"></div>'+
    '<section class="kutu">'+odemeTablo(L,A,bugun,{toplam:F.dur!=="ÖDENEN",bos:"Bu filtreye uyan ödeme yok."})+'</section>';
}

function sCekler(K,A,bugun){
  const C=K.filter(k=>k.kat==="ÇEK"&&bekliyor(k));
  let h='<div class="bas"><h2>Verilen Çekler Takvimi</h2><div class="sag"><button class="btn pri" data-act="yeniOdeme" data-kat="ÇEK">+ Çek ekle</button></div></div>';
  if(!C.length)return h+'<div class="kutu"><div class="bos">Bekleyen verilen çek yok.</div></div>';
  const bankalar=[...new Set(C.map(k=>k.banka||"—"))].sort();const renk=bankaRenk(bankalar);
  const son=ayEkle(bugun,A.cekAy);const gec=C.filter(k=>k.vade<bugun);
  const sat=(ad,L,cls)=>'<tr class="'+(cls||"")+'"><td>'+ad+'</td>'+bankalar.map(b=>{const v=L.filter(k=>(k.banka||"—")===b).reduce((a,k)=>a+(k.tutar||0),0);return'<td class="tl">'+(v?tl(v):"—")+'</td>';}).join("")+
    '<td class="tl"><b>'+tl(L.reduce((a,k)=>a+(k.tutar||0),0))+'</b></td><td class="r num">'+L.length+'</td></tr>';
  const bas='<tr><th>Dönem</th>'+bankalar.map(b=>'<th class="r"><span style="color:'+renk[b]+'">■</span> '+esc(b)+'</th>').join("")+'<th class="r">Toplam</th><th class="r">Adet</th></tr>';
  let ay='';if(gec.length)ay+=sat("Gecikmiş",gec,"gec");
  for(let d=new Date(bugun.getFullYear(),bugun.getMonth(),1);d<=son;d=new Date(d.getFullYear(),d.getMonth()+1,1)){
    const L=C.filter(k=>k.vade>=bugun&&k.vade.getFullYear()===d.getFullYear()&&k.vade.getMonth()===d.getMonth());ay+=sat(ayAd(d.getFullYear(),d.getMonth()),L);}
  const sonra=C.filter(k=>k.vade>new Date(son.getFullYear(),son.getMonth()+1,0));if(sonra.length)ay+=sat("Sonrası",sonra);
  ay+=sat("TOPLAM",C,"top");
  h+='<section class="kutu"><div class="hd"><h3>Aylık</h3></div><div class="tw"><table class="t"><thead>'+bas+'</thead><tbody>'+ay+'</tbody></table></div></section>';
  const pzt=gunEkle(bugun,-((bugun.getDay()+6)%7));let hf='';
  for(let a=pzt;a<=son;a=gunEkle(a,7)){const b=gunEkle(a,6);const L=C.filter(k=>a.getTime()===pzt.getTime()?k.vade<=b:k.vade>=a&&k.vade<=b);if(!L.length)continue;
    hf+=sat(trK(a)+" – "+trT(b),L,a<=bugun?"acil":fark(a,bugun)<14?"hafta":"");}
  h+='<section class="kutu"><div class="hd"><h3>Haftalık (Pazartesi–Pazar)</h3><span class="say">Yalnız çek olan haftalar · ilk hafta gecikmişleri içerir</span></div><div class="tw"><table class="t"><thead>'+bas.replace("Dönem","Hafta")+'</thead><tbody>'+hf+'</tbody></table></div></section>';
  const fm=new Map();C.forEach(k=>{const x=fm.get(k.kime||"—")||{t:0,n:0,ilk:k.vade};x.t+=k.tutar||0;x.n++;if(k.vade<x.ilk)x.ilk=k.vade;fm.set(k.kime||"—",x);});
  h+='<div class="ikili"><section class="kutu"><div class="hd"><h3>Lehdar bazında</h3></div><div class="tw"><table class="t"><thead><tr><th>Lehdar</th><th class="r">Toplam</th><th class="r">Adet</th><th>İlk vade</th></tr></thead><tbody>'+
    [...fm].sort((a,b)=>b[1].t-a[1].t).map(([a,x])=>'<tr><td class="ad">'+esc(a)+'</td><td class="tl">'+tl(x.t)+'</td><td class="r num">'+x.n+'</td><td class="d">'+trT(x.ilk)+'</td></tr>').join("")+'</tbody></table></div></section>';
  h+='<section class="kutu"><div class="hd"><h3>Bekleyen çekler</h3></div>'+odemeTablo(C,A,bugun,{dar:true,toplam:true})+'</section></div>';
  return h;
}

  if(!P.length)return h+'<div class="kutu"><div class="bos">Banka hesabı yok. Bakiye ve KMH limitini girince ödemelerin yetip yetmediğini burada görürsünüz.</div></div>';
  P.forEach(p=>{

  r+='</tbody></table></div>';

  const dbs=new Map();S.dbslimit.forEach(x=>dbs.set(up(x.kime)+"|"+up(x.banka),{f:up(x.kime),b:up(x.banka),lim:sayi(x.limit)||0,kul:0,id:x.id}));

function alanHtml(a,v){
  const id="f_"+a.k;let val=v[a.k];if(val==null&&a.vars==="bugun")val=iso(bugunD());
  const lab='<label for="'+id+'">'+esc(a.l)+(a.req?" *":"")+'</label>';const y=a.y?'<span class="yd">'+esc(a.y)+'</span>':"";
  if(a.t==="check"){const c=val==null?!!a.vars:!!val;return'<div class="alan chk'+(a.gen?" gen":"")+'"><input type="checkbox" id="'+id+'"'+(c?" checked":"")+'><label for="'+id+'">'+esc(a.l)+'</label></div>';}
  let inp;
  if(a.t==="select")inp='<select id="'+id+'">'+a.o.map(o=>'<option value="'+esc(o)+'"'+(up(val)===up(o)?" selected":"")+'>'+(o||"Otomatik")+'</option>').join("")+'</select>';
  else if(a.t==="gider")inp='<select id="'+id+'"><option value="">Otomatik (türüne göre)</option>'+GIDER.map(([g,ks])=>'<optgroup label="'+esc(g)+'">'+ks.map(k=>'<option'+(val===k?" selected":"")+'>'+esc(k)+'</option>').join("")+'</optgroup>').join("")+'</select>';
  else if(a.t==="kart")inp='<select id="'+id+'"><option value="">Seçin</option>'+S.kart.map(k=>'<option value="'+k.id+'"'+(val===k.id?" selected":"")+'>'+esc(k.ad)+'</option>').join("")+'</select>';
  else if(a.t==="personel")inp='<select id="'+id+'"><option value="">Seçin</option>'+S.personel.slice().sort((x,y)=>String(x.ad).localeCompare(String(y.ad),"tr")).map(p=>'<option value="'+p.id+'"'+(val===p.id?" selected":"")+'>'+esc(p.ad)+'</option>').join("")+'</select>';
  else if(a.t==="date")inp='<input type="date" id="'+id+'" value="'+esc(val||"")+'">';
  else if(a.t==="money")inp='<input id="'+id+'" inputmode="decimal" class="num" value="'+(val==null||val===""?"":esc(String(val).replace(".",",")))+'">';
  else if(a.t==="int")inp='<input id="'+id+'" inputmode="numeric" class="num" value="'+esc(val??"")+'">';
  else inp='<input id="'+id+'" value="'+esc(val??"")+'"'+(a.dl?' list="'+a.dl+'"':"")+' autocomplete="off">';
  return'<div class="alan'+(a.gen?" gen":"")+'">'+lab+inp+y+'</div>';
}
function formOku(alanlar){
  const r={},eks=[];
  alanlar.forEach(a=>{const e=document.getElementById("f_"+a.k);if(!e)return;
    let v;if(a.t==="check")v=e.checked;else if(a.t==="money"){v=sayi(e.value);if(e.value.trim()&&v==null)eks.push(a.l+" sayı olmalı");}
    else if(a.t==="int"){v=sayi(e.value);v=v==null?null:Math.round(v);}else v=e.value.trim();
    if(["banka","hesap","odemeBanka","odemeHesap"].includes(a.k)&&v)v=up(v);
    if(a.req&&(v==null||v===""))eks.push(a.l);r[a.k]=v;});
  return {r,eks};
}
let MODAL=null;
function modalAc({baslik,alanlar,veri,kaydetFn,silFn,ekBtn}){
  const dl='<datalist id="bankaDL">'+bankaListe().map(b=>'<option value="'+esc(b)+'">').join("")+'</datalist><datalist id="hesapDL">'+hesapListe().map(b=>'<option value="'+esc(b)+'">').join("")+'</datalist>'+
    '<datalist id="kimeDL">'+[...new Set(S.odeme.map(o=>o.kime).filter(Boolean))].slice(0,200).map(b=>'<option value="'+esc(b)+'">').join("")+'</datalist>';
  $("#ort").innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mB"><div class="mh"><h3 id="mB">'+esc(baslik)+'</h3><button data-act="kapat" aria-label="Kapat">×</button></div>'+
    '<form id="mF"><div class="mb">'+alanlar.map(a=>alanHtml(a,veri||{})).join("")+'<div class="hata" id="mH"></div></div>'+dl+
    '<div class="mf">'+(silFn?'<button type="button" class="btn tehlike" data-act="silOnay">Sil</button>':"")+(ekBtn||"")+'<div class="sag"><button type="button" class="btn" data-act="kapat">Vazgeç</button><button type="submit" class="btn pri">Kaydet</button></div></div></form></div>';
  $("#ort").hidden=false;MODAL={alanlar,kaydetFn,silFn};
  const ilk=$("#ort .mb input, #ort .mb select");if(ilk)ilk.focus();
}
function modalKapat(){$("#ort").hidden=true;$("#ort").innerHTML="";MODAL=null;}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="mF"||!MODAL)return;e.preventDefault();
  const {r,eks}=formOku(MODAL.alanlar);
  if(eks.length){$("#mH").textContent="Eksik ya da hatalı: "+eks.join(", ");return;}
  const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;
  try{await MODAL.kaydetFn(r);modalKapat();toast("Kaydedildi");}catch(x){btn.disabled=false;}
});

function odemeFormu(kat,doc,ek){
  const v=Object.assign({},doc||{},ek||{});
  modalAc({baslik:(doc?"":"Yeni ")+(kat==="KREDİ KARTI"?"kart ekstresi":kat.toLocaleLowerCase("tr")+(kat==="ÇEK"?"":" ödemesi")),alanlar:ODEME_ALAN[kat],veri:v,
    ekBtn:doc?"":'<select class="sec" id="katSec" aria-label="Ödeme türü">'+KATS.filter(k=>k!=="DÜZENLİ").map(k=>'<option'+(k===kat?" selected":"")+'>'+k+'</option>').join("")+'</select>',
    kaydetFn:async r=>{const body=Object.assign({},doc||{},ek||{},r,{kat});delete body.id;
      if(kat==="KREDİ KARTI"){const kt=S.kart.find(k=>k.id===r.kartId);if(kt)body.kartAd=kt.ad;}
      if(r.odemeTarihi&&!r.durum&&kat!=="KREDİ KARTI")body.durum="ÖDENDİ";
      await kaydet("odeme",doc&&doc.id,body);},
    silFn:doc?async()=>sil("odeme",doc.id):null});
}
function kayitFormu(col,doc,ek){
  const c=COL[col];
  modalAc({baslik:(doc?"":"Yeni ")+c.b.toLocaleLowerCase("tr"),alanlar:c.a,veri:Object.assign({},doc||{},ek||{}),
    kaydetFn:async r=>{const body=Object.assign({},doc||{},r);delete body.id;
      if(col==="izin"){const p=S.personel.find(x=>x.id===r.personelId);if(p)body.personelAd=p.ad;if(r.bit&&r.bas&&r.bit<r.bas)throw($("#mH").textContent="Bitiş, başlangıçtan önce olamaz.");}
      await kaydet(col,doc&&doc.id,body);},
    silFn:doc?async()=>sil(col,doc.id):null});
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==="kapat"){modalKapat();return;}
  if(a==="silOnay"){const mb=$("#ort .mb");if(!$("#silKutu")){mb.insertAdjacentHTML("beforeend",'<div class="onay" id="silKutu">Bu kayıt kalıcı olarak silinecek. <button type="button" class="btn kc tehlike" data-act="silEvet">Evet, sil</button></div>');}return;}
  if(a==="silEvet"&&MODAL&&MODAL.silFn){await MODAL.silFn();modalKapat();toast("Silindi");return;}
  if(a==="fKat"){F.kat=b.dataset.v;render();return;}
  if(a==="yeniOdeme"){odemeFormu(b.dataset.kat||"ÇEK");return;}
  if(a==="yeni"){kayitFormu(b.dataset.col);return;}
  if(a==="duz"){const d=S[b.dataset.col].find(x=>x.id===id);if(d)kayitFormu(b.dataset.col,d);return;}
  if(a==="ekstre"){odemeFormu("KREDİ KARTI",null,{kartId:id});return;}
  if(a==="ayar"){modalAc({baslik:"Genel ayarlar",veri:S.ayar,alanlar:[{k:"firma",l:"Firma adı",t:"text",gen:1},{k:"ufuk",l:"Yaklaşan ödeme ufku (gün)",t:"int"},{k:"acil",l:"Acil uyarı (gün)",t:"int"},
      {k:"cekAy",l:"Çek takvimi (ay)",t:"int"},{k:"gecmisAy",l:"Raporda geçmiş ay",t:"int"},{k:"haftaTatili",l:"Hafta tatili",t:"select",o:["PAZAR","CUMARTESİ,PAZAR"]},{k:"dogumGunu",l:"Doğum günü hatırlat (gün önce)",t:"int"}],
      kaydetFn:async r=>ayarKaydet(r)});return;}
  if(a==="bakiye"){const h=S.banka.find(x=>x.id===id);if(!h)return;
    modalAc({baslik:hesapEt(h)+" bakiyesi",veri:{bakiye:"",bakiyeTarihi:iso(bugunD())},alanlar:[{k:"bakiye",l:"Güncel bakiye ₺",t:"money",req:1},{k:"bakiyeTarihi",l:"Tarih",t:"date",req:1}],
      kaydetFn:async r=>{const x={...h,...r};delete x.id;await kaydet("banka",h.id,x);}});return;}
  if(a==="kalemDuz"){const k=KMAP.get(id);if(!k)return;
    if(!k.tahmini){odemeFormu(k.doc.kat||"DİĞER",k.doc);return;}
    if(k.kart){odemeFormu("KREDİ KARTI",null,{kartId:k.kart.id,vade:iso(k.vade),kaynak:k.kaynak});return;}
    const dz=k.duz;const kat=k.kat==="FATURA"?"FATURA":"DÜZENLİ";
    odemeFormu(kat,null,{tur:k.tur,aciklama:dz.aciklama,kime:dz.ref||"",no:dz.ref||"",vade:iso(k.vade),tutar:k.tutar,banka:dz.banka,hesap:dz.hesap,gider:dz.gider,yer:dz.yer,kaynak:k.kaynak});return;}
  if(a==="ode"){const k=KMAP.get(id);if(!k)return;
    modalAc({baslik:"Ödendi: "+k.aciklama,veri:{odemeTarihi:iso(bugunD()),tutar:k.tutar},alanlar:[{k:"odemeTarihi",l:"Ödeme tarihi",t:"date",req:1},{k:"tutar",l:k.kat==="KREDİ KARTI"?"Ödenen tutar ₺":"Tutar ₺",t:"money",req:k.tutar==null,y:k.kat==="KREDİ KARTI"?"Ekstreden az girerseniz kalanı hatırlatılmaya devam eder":""}],
      kaydetFn:async r=>{
        if(k.tahmini){
          const base={vade:iso(k.vade),odemeTarihi:r.odemeTarihi,kaynak:k.kaynak,banka:k.banka,hesap:k.hesap,ornek:k.ornek||undefined};
          if(k.kart)await kaydet("odeme",null,{...base,kat:"KREDİ KARTI",kartId:k.kart.id,kartAd:k.kart.ad,tutar:r.tutar,odenen:r.tutar});
          else{const dz=k.duz;await kaydet("odeme",null,{...base,kat:k.kat==="FATURA"?"FATURA":"DÜZENLİ",tur:k.tur,aciklama:dz.aciklama,no:dz.ref,kime:dz.ref,tutar:r.tutar??k.tutar,durum:"ÖDENDİ",gider:dz.gider,yer:dz.yer});}
        }else{
          const d={...k.doc};delete d.id;
          if(k.kat==="KREDİ KARTI"){d.odenen=(sayi(d.odenen)||0)+(r.tutar??k.tutar??0);d.odemeTarihi=r.odemeTarihi;}
          else{d.durum="ÖDENDİ";d.odemeTarihi=r.odemeTarihi;if(r.tutar!=null)d.tutar=r.tutar;}
          await kaydet("odeme",k.id,d);
        }}});return;}
  if(a==="ornekSil"){const L=[];KOLEKSIYON.forEach(c=>S[c].filter(x=>x.ornek).forEach(x=>L.push([c,x.id])));
    for(const [c,i] of L){try{await sil(c,i);}catch(x){break;}}toast(L.length+" örnek kayıt silindi");return;}
  if(a==="xlsYukle"){$("#xlsDosya").click();return;}
  if(a==="xlsIndir"){xlsIndir();return;}
});

function hucreTarih(v){
  if(v instanceof Date)return iso(new Date(v.getFullYear(),v.getMonth(),v.getDate()+(v.getHours()>=12?1:0)));
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());}
  const s=String(v||"").trim();let m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);if(m)return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:null;
}
async function xlsYukle(f){
  if(!window.XLSX){toast("Excel okuyucu yüklenemedi, sayfayı yenileyin.");return;}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});
    const bul=ad=>wb.SheetNames.find(n=>up(n)===up(ad))||wb.SheetNames.find(n=>up(n).includes(up(ad)));
    const yeni=[];const kartAd=new Map(S.kart.map(k=>[up(k.ad),k.id]));const pers=new Map();S.personel.forEach(p=>{if(p.sicil)pers.set("S"+up(p.sicil),p.id);pers.set("A"+up(p.ad),p.id);});
    const order=["BANKALAR","KREDİ KARTLARI","PERSONEL","BANKA İŞLEMLERİ","VERİLEN ÇEKLER","KART EKSTRELERİ","DBS","FATURALAR","DÜZENLİ ÖDEMELER","DİĞER ÖDEMELER","İZİNLER"];
    const limitler=new Map();
    for(const sn of order){
      const m=XL.find(x=>x.s===sn),n=bul(sn);if(!n)continue;
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true});if(rows.length<2)continue;
      const hd=rows[0].map(up);
      rows.slice(1).forEach(r=>{
        if(!r.some(v=>v!=null&&String(v).trim()!==""))return;
        const o={};m.cols.forEach(([h,k,t])=>{const i=hd.indexOf(up(h));if(i<0)return;let v=r[i];if(v==null||v==="")return;
          if(t==="d")v=hucreTarih(v);else if(t==="n")v=sayi(v);else if(t==="b")v=up(v).startsWith("E");else v=String(v).trim();if(v!=null&&v!=="")o[k]=v;});
        if(!Object.keys(o).length)return;
        const id=yeniId();
        if(m.c==="odeme"){o.kat=m.kat[0];if(sn==="DİĞER ÖDEMELER")o.kat="DİĞER";}
        if(m.c==="kart"){kartAd.set(up(o.ad),id);}
        if(sn==="KART EKSTRELERİ"){o.kartId=kartAd.get(up(o.kartAd))||null;}
        if(sn==="DBS"&&o._limit){limitler.set(up(o.kime)+"|"+up(o.banka),{kime:o.kime,banka:up(o.banka),limit:o._limit});}
        delete o._limit;
        if(m.c==="personel"){if(o.sicil)pers.set("S"+up(o.sicil),id);pers.set("A"+up(o.ad),id);}
        if(m.c==="izin"){o.personelId=(o._sicil&&pers.get("S"+up(o._sicil)))||pers.get("A"+up(o.personelAd))||null;delete o._sicil;}
        if(m.c==="hareket"&&up(o.tur).startsWith("C"))o.tur="ÇIKIŞ";
        ["banka","hesap","odemeBanka","odemeHesap"].forEach(k=>{if(o[k])o[k]=up(o[k]);});
        yeni.push([m.c,id,o]);
      });
    }
    limitler.forEach(v=>yeni.push(["dbslimit",yeniId(),v]));
    const an=bul("AYARLAR");
    if(an){const rows=XLSX.utils.sheet_to_json(wb.Sheets[an],{header:1,defval:null});const d={};rows.forEach(r=>{if(r[0])d[up(r[0])]=r[1];});
      const ay={};const g=(k,a)=>{if(d[up(k)]!=null&&d[up(k)]!=="")ay[a]=d[up(k)];};g("Firma Adı","firma");g("Yaklaşan Ödeme Ufku (gün)","ufuk");g("Acil Uyarı (gün)","acil");g("Çek Takvimi (ay)","cekAy");g("Rapor Geçmişi (ay)","gecmisAy");g("Hafta Tatili","haftaTatili");g("Doğum Günü Hatırlat (gün)","dogumGunu");
      if(Object.keys(ay).length)await ayarKaydet(ay);}
    if(!yeni.length){toast("Dosyada okunacak kayıt bulunamadı.");return;}
    toast(yeni.length+" kayıt aktarılıyor…");
    let n=0;for(const [c,id,o] of yeni){try{await kaydet(c,id,o);n++;}catch(x){break;}}
    toast(n+" kayıt içe aktarıldı");
  }catch(x){toast("Dosya okunamadı: HATIRLATICI.xlsx şablonunu kullanın.");}
}
async function xlsIndir(){
  if(!window.XLSX){toast("Excel yazıcı yüklenemedi, sayfayı yenileyin.");return;}
  const wb=XLSX.utils.book_new();
  const ayarRows=[["Ayar","Değer","Açıklama"],["Firma Adı",S.ayar.firma||""],["Yaklaşan Ödeme Ufku (gün)",S.ayar.ufuk],["Acil Uyarı (gün)",S.ayar.acil],["Takvim Hatırlatma (gün önce)","3,1"],["Çek Takvimi (ay)",S.ayar.cekAy],["Rapor Geçmişi (ay)",S.ayar.gecmisAy],["Hafta Tatili",S.ayar.haftaTatili||"PAZAR"],["Doğum Günü Hatırlat (gün)",S.ayar.dogumGunu]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ayarRows),"AYARLAR");
  const lim=new Map(S.dbslimit.map(x=>[up(x.kime)+"|"+up(x.banka),sayi(x.limit)]));const verildi=new Set();
  XL.forEach(m=>{
    let L=S[m.c];if(m.kat)L=L.filter(x=>m.kat.includes(x.kat||"DİĞER"));
    const rows=[m.cols.map(c=>c[0])];
    L.forEach(x=>{const o={...x};
      if(m.s==="KART EKSTRELERİ"){const k=kartBul(x);o.kartAd=k?k.ad:x.kartAd;}
      if(m.s==="DBS"){const key=up(x.kime)+"|"+up(x.banka);if(!verildi.has(key)&&lim.has(key)){o._limit=lim.get(key);verildi.add(key);}}
      if(m.s==="İZİNLER"){const p=S.personel.find(y=>y.id===x.personelId);if(p){o._sicil=p.sicil;o.personelAd=p.ad;}}
      if(m.s==="DİĞER ÖDEMELER"&&!o.tur)o.tur=x.kat;
      rows.push(m.cols.map(([h,k,t])=>{const v=o[k];if(v==null||v==="")return null;if(t==="d"){const d=tarih(v);return d||null;}if(t==="b")return v?"EVET":"HAYIR";if(t==="n")return sayi(v);return v;}));});
    const ws=XLSX.utils.aoa_to_sheet(rows,{cellDates:true});ws["!cols"]=m.cols.map(c=>({wch:Math.max(11,c[0].length+2)}));
    XLSX.utils.book_append_sheet(wb,ws,m.s);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Tarih","Açıklama","Yarım Gün"],...TATIL.map(t=>[tarih(t[0]),t[1],t[2]?"EVET":""])],{cellDates:true}),"TATİLLER");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Grup","Gider Kalemi"],...GIDER.flatMap(([g,ks])=>ks.map(k=>[g,k]))]),"GİDER KALEMLERİ");
  const buf=XLSX.write(wb,{type:"array",bookType:"xlsx",cellDates:true});
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(x){}
  if(!dl){toast("Bu görünümde dosya indirilemiyor.");return;}
  try{await dl.save({filename:"HATIRLATICI_"+iso(bugunD()).replace(/-/g,"")+".xlsx",data:new Uint8Array(buf)});toast("Excel dosyası hazır");}
  catch(x){if(x&&x.code!=="declined")toast("İndirilemedi ("+(x.code||"hata")+")");}
}

baslat();
